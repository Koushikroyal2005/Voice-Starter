# Trusted backend metadata only. No credentials; models are not auto-selected.
version: 1
name: "openai_compatible"
categories:
  llm:
    adapter: "openai_compatible"
    api_key_env: "LLM_API_KEY"
    default_model: "gpt-4.1-mini"
    base_url: "https://api.openai.com/v1"
    allow_custom_models: true
    capabilities:
      streaming: true
      interim_transcription: null
      turn_detection: null
      multilingual: null
      cancellation: true
      tool_calling: null
      notes: "Cancellation closes local streams; remote billing may continue."
    models:
      "gpt-4.1-mini":
        capabilities:
          streaming: true
          interim_transcription: null
          turn_detection: null
          multilingual: null
          cancellation: true
          tool_calling: null
          notes: "Cancellation closes local streams; remote billing may continue."
        voice: ""
    docs: "https://docs.livekit.io/agents/models/llm/openai/"
