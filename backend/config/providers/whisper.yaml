# Trusted backend metadata only. No credentials; models are not auto-selected.
version: 1
name: "whisper"
categories:
  stt:
    adapter: "whisper"
    api_key_env: "OPENAI_API_KEY"
    default_model: "whisper-1"
    base_url: "https://api.openai.com/v1"
    allow_custom_models: false
    capabilities:
      streaming: false
      interim_transcription: false
      turn_detection: false
      multilingual: true
      cancellation: true
      tool_calling: null
      notes: "Cancellation closes local streams; remote billing may continue."
    models:
      "whisper-1":
        capabilities:
          streaming: false
          interim_transcription: false
          turn_detection: false
          multilingual: true
          cancellation: true
          tool_calling: null
          notes: "Cancellation closes local streams; remote billing may continue."
        voice: ""
    docs: "https://docs.livekit.io/agents/models/stt/openai/"
