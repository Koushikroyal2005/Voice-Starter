[project]
name = "voice-starter-backend"
version = "0.1.0"
description = "LiveKit cascaded voice agent for Voice-Starter"
requires-python = ">=3.13,<3.14"
dependencies = [
    "livekit-agents[deepgram,openai,cartesia,silero,assemblyai,google,elevenlabs,murf]==1.8.12",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6,<7",
    "pydantic>=2.10,<3",
    "jsonschema>=4.23,<5",
    "referencing>=0.36,<1",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "redis>=6,<8",
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "aiosqlite>=0.21,<1"]

[project.optional-dependencies]
telemetry = ["prometheus-client>=0.22,<1", "sentry-sdk>=2,<3"]
mcp = ["livekit-agents[mcp]==1.8.12", "mcp>=2.3,<3"]

[tool.uv]
package = false
constraint-dependencies = ["yarl<1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
